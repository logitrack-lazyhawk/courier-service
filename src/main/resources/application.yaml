spring:
  application:
    name: courier-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    compatibility-verifier:
      enabled: false
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8085}"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:courier_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}

server:
  port: 8081
