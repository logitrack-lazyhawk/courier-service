spring:
  application:
    name: courier-service-test
  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never


app:
  normalizacion:
    telefono:
      codigo-pais: "54"
      prefijo-internacional: "+54"
      prefijo-movil: "+549"
      prefijo-interurbano: "0"
      prefijo-movil-local: "15"
      area-amba: "11"
      prefijo-amba-con-quince: "1115"
      regex-limpieza: "[.\\-\\s()]"
    dni:
      regex-limpieza: "[.\\-\\s]"